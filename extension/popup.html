<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #00d4ff;
    }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .connected {
      background: #0a2e1a;
      border: 1px solid #00ff88;
      color: #00ff88;
    }
    .disconnected {
      background: #2e0a0a;
      border: 1px solid #ff4444;
      color: #ff4444;
    }
    .info {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
    }
    button {
      background: #00d4ff;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
    }
    button:hover {
      background: #00b8d4;
    }
  </style>
</head>
<body>
  <h1>Alfa DevTools Bridge</h1>
  <div id="status" class="status disconnected">Checking...</div>
  <button id="connect">Connect to Bridge</button>
  <div class="info">
    Bridge: ws://127.0.0.1:9223
  </div>
  <script src="popup.js"></script>
</body>
</html>
