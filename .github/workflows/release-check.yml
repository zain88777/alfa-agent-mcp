name: Release Check

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Show toolchain versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Run release gates with logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs

          npm run lint 2>&1 | tee artifacts/logs/lint.log
          npm run typecheck 2>&1 | tee artifacts/logs/typecheck.log
          npm run build 2>&1 | tee artifacts/logs/build.log
          npm run test 2>&1 | tee artifacts/logs/test.log
          npm run env:guard 2>&1 | tee artifacts/logs/env-guard.log

      - name: Build release evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Release Evidence"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Timestamp (UTC): $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "- Node: $(node -v)"
            echo "- npm: $(npm -v)"
            echo "- Command: npm run release:check"
            echo "- Result: PASS"
            TESTS_TOTAL=$(grep -m1 -E '(^| )tests +[0-9]+$' artifacts/logs/test.log | grep -oE '[0-9]+$')
            TESTS_PASS=$(grep -m1 -E '(^| )pass +[0-9]+$' artifacts/logs/test.log | grep -oE '[0-9]+$')
            echo "- Tests: ${TESTS_PASS:-0}/${TESTS_TOTAL:-0} passed"
            echo "- Build: PASS"
          } > artifacts/release-evidence.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-check-artifacts
          path: artifacts/
          if-no-files-found: error
